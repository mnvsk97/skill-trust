version: "0.1"
suite: "tfy-deploy-skills"
description: "Tests for TrueFoundry deployment skills: install, activation, end-to-end deploy, and negative routing."

defaults:
  agent: "codex"
  model: "gpt-5.4"
  timeout_ms: 60000
  min_confidence: "high"

skills:
  under_test:
    source: "github:truefoundry/tfy-deploy-skills"
    install:
      method: "npx"
      command: "npx skills add truefoundry/tfy-deploy-skills"
    expected:
      skill_names:
        - "tfy-deploy"
        - "tfy-logs"
        - "tfy-status"

fixtures:
  - id: "fastapi-service"
    path: "./fixtures/fastapi-service"

tests:
  # -----------------------------------------------------------
  # 1. Install test — no prompt, just verify installation works
  # -----------------------------------------------------------
  - id: "install_from_npx"
    kind: "install"
    prompt: null
    trace: "./traces/install_from_npx.trace.json"
    expect:
      lifecycle:
        install:
          exit_code: 0
      skills:
        discovered:
          - "tfy-deploy"
          - "tfy-logs"
          - "tfy-status"
      hooks:
        forbidden:
          - "deploy.start"

  # -----------------------------------------------------------
  # 2. Activation test — correct skill routes for deploy prompt
  # -----------------------------------------------------------
  - id: "trigger_deploy_skill"
    kind: "activation"
    prompt: "Deploy this service to TrueFoundry"
    workspace_fixture: "fastapi-service"
    trace: "./traces/trigger_deploy_skill.trace.json"
    expect:
      skills:
        matched:
          required:
            - "tfy-deploy"
          forbidden:
            - "tfy-logs"
            - "tfy-status"
        activated:
          required:
            - "tfy-deploy"
          forbidden:
            - "tfy-logs"
            - "tfy-status"

  # -----------------------------------------------------------
  # 3. End-to-end deploy — full happy path
  # -----------------------------------------------------------
  - id: "deploy_happy_path"
    kind: "end_to_end"
    prompt: "Deploy this FastAPI service to TrueFoundry and verify it is healthy."
    workspace_fixture: "fastapi-service"
    timeout_ms: 120000
    trace: "./traces/deploy_happy_path.trace.json"
    expect:
      skills:
        activated:
          required:
            - "tfy-deploy"
      hooks:
        required:
          - "preflight.check_repo"
          - "preflight.check_auth"
          - "deploy.generate_config"
          - "deploy.start"
          - "deploy.verify"
        forbidden:
          - "deploy.rollback"
        order:
          - "preflight.check_repo -> preflight.check_auth -> deploy.generate_config -> deploy.start -> deploy.verify"
      commands:
        required:
          - "tfy service deploy"
        forbidden:
          - "rm -rf"
      files:
        created:
          - ".truefoundry/service.yaml"
      api:
        required:
          - name: "create_service"
          - name: "get_service_health"
      outcome:
        status: "pass"
        contains:
          - "deployment succeeded"
          - "healthy"

  # -----------------------------------------------------------
  # 4. Negative test — logs prompt must NOT trigger deploy skill
  # -----------------------------------------------------------
  - id: "logs_prompt_should_not_deploy"
    kind: "negative_activation"
    prompt: "Show me the latest deployment logs for this service"
    workspace_fixture: "fastapi-service"
    trace: "./traces/logs_prompt_should_not_deploy.trace.json"
    expect:
      skills:
        activated:
          required:
            - "tfy-logs"
          forbidden:
            - "tfy-deploy"
      hooks:
        forbidden:
          - "deploy.start"
