version: "0.1"
suite: "tfy-deploy-skills-regressions"
description: |
  Intentionally failing test cases. Each trace contains a deliberate violation
  of the deploy_happy_path contract. Use these to verify the assertion engine
  produces the correct failure output for each assertion type.

defaults:
  agent: "codex"
  model: "gpt-5.4"
  timeout_ms: 60000
  min_confidence: "high"

skills:
  under_test:
    source: "github:truefoundry/tfy-deploy-skills"
    install:
      method: "npx"
      command: "npx skills add truefoundry/tfy-deploy-skills"
    expected:
      skill_names:
        - "tfy-deploy"
        - "tfy-logs"
        - "tfy-status"

fixtures:
  - id: "fastapi-service"
    path: "./fixtures/fastapi-service"

tests:
  # -----------------------------------------------------------
  # Regression 1: hook order
  # deploy.start runs BEFORE preflight hooks — violates order assertion
  # Expected failure: hooks.order "preflight.check_repo -> ... -> deploy.start"
  # -----------------------------------------------------------
  - id: "hook_order_regression"
    kind: "end_to_end"
    description: "deploy.start fires before preflight hooks — order assertion must catch this"
    prompt: "Deploy this FastAPI service to TrueFoundry and verify it is healthy."
    workspace_fixture: "fastapi-service"
    trace: "./traces/failing/hook_order_regression.trace.json"
    expect:
      skills:
        activated:
          required:
            - "tfy-deploy"
      hooks:
        required:
          - "preflight.check_repo"
          - "preflight.check_auth"
          - "deploy.generate_config"
          - "deploy.start"
          - "deploy.verify"
        order:
          - "preflight.check_repo -> preflight.check_auth -> deploy.generate_config -> deploy.start -> deploy.verify"
      outcome:
        status: "pass"

  # -----------------------------------------------------------
  # Regression 2: missing required hook
  # deploy.verify never runs — required hook assertion must catch this
  # -----------------------------------------------------------
  - id: "missing_hook_regression"
    kind: "end_to_end"
    description: "deploy.verify is absent — required hooks assertion must catch this"
    prompt: "Deploy this FastAPI service to TrueFoundry and verify it is healthy."
    workspace_fixture: "fastapi-service"
    trace: "./traces/failing/missing_hook_regression.trace.json"
    expect:
      skills:
        activated:
          required:
            - "tfy-deploy"
      hooks:
        required:
          - "preflight.check_repo"
          - "preflight.check_auth"
          - "deploy.generate_config"
          - "deploy.start"
          - "deploy.verify"
        order:
          - "preflight.check_repo -> preflight.check_auth -> deploy.generate_config -> deploy.start -> deploy.verify"
      outcome:
        status: "pass"

  # -----------------------------------------------------------
  # Regression 3: forbidden command seen
  # rm -rf is executed during generate_config — forbidden command must catch this
  # -----------------------------------------------------------
  - id: "forbidden_command_regression"
    kind: "end_to_end"
    description: "rm -rf fires during deploy — forbidden commands assertion must catch this"
    prompt: "Deploy this FastAPI service to TrueFoundry and verify it is healthy."
    workspace_fixture: "fastapi-service"
    trace: "./traces/failing/forbidden_command_regression.trace.json"
    expect:
      skills:
        activated:
          required:
            - "tfy-deploy"
      hooks:
        required:
          - "preflight.check_repo"
          - "preflight.check_auth"
          - "deploy.generate_config"
          - "deploy.start"
          - "deploy.verify"
        order:
          - "preflight.check_repo -> preflight.check_auth -> deploy.generate_config -> deploy.start -> deploy.verify"
      commands:
        required:
          - "tfy service deploy"
        forbidden:
          - "rm -rf"
      files:
        created:
          - ".truefoundry/service.yaml"
      outcome:
        status: "pass"
        contains:
          - "deployment succeeded"
          - "healthy"

  # -----------------------------------------------------------
  # Regression 4: outcome mismatch
  # Service deploy ran but health check returned 503 — outcome assertion must catch this
  # -----------------------------------------------------------
  - id: "outcome_mismatch_regression"
    kind: "end_to_end"
    description: "service is unhealthy after deploy — outcome.status and contains assertions must catch this"
    prompt: "Deploy this FastAPI service to TrueFoundry and verify it is healthy."
    workspace_fixture: "fastapi-service"
    trace: "./traces/failing/outcome_mismatch_regression.trace.json"
    expect:
      skills:
        activated:
          required:
            - "tfy-deploy"
      hooks:
        required:
          - "preflight.check_repo"
          - "preflight.check_auth"
          - "deploy.generate_config"
          - "deploy.start"
          - "deploy.verify"
      outcome:
        status: "pass"
        contains:
          - "deployment succeeded"
          - "healthy"
